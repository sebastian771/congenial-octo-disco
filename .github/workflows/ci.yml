name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gmp, soap, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lockfile
        run: composer validate --strict --no-check-publish

      # Do not bootstrap Laravel or run package discovery: static checks
      # must not require a database, Redis, or a running game server.
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z -- '*.php')

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      # Add a dedicated tests job when tests/ and phpunit.xml are ready.
      # See .github/README.md for isolation requirements.

  frontend:
    name: Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # vite.config.js resolves ziggy-js from vendor/tightenco/ziggy.
      - name: Set up PHP for Ziggy dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gmp, soap, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies for Ziggy
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build
